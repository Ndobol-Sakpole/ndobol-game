[profile.default]
src = "src"
out = "out"
libs = ["vendor"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=vendor/openzeppelin/"]

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"
