services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.game
    ports:
      - "127.0.0.1:${WEB_PORT:-4174}:4174"
    environment:
      API_ORIGIN: http://api:8787
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    ports:
      - "127.0.0.1:${API_PORT:-8787}:8787"
    environment:
      DATA_BACKEND: ${DATA_BACKEND:-sqlite}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SIGNER_PRIVATE_KEY: ${SIGNER_PRIVATE_KEY:-}
      SIGNING_CHAIN_ID: ${SIGNING_CHAIN_ID:-10143}
      RIVER_REGISTRY_ADDRESS: ${RIVER_REGISTRY_ADDRESS:-}
      REWARD_POOL_ADDRESS: ${REWARD_POOL_ADDRESS:-}
      REWARD_CLAIMS_ENABLED: ${REWARD_CLAIMS_ENABLED:-false}
      REWARD_SPONSOR_ENABLED: ${REWARD_SPONSOR_ENABLED:-false}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-}
      RELAYER_DAILY_BUDGET_MON: ${RELAYER_DAILY_BUDGET_MON:-0.1}
      RELAYER_MAX_GAS_PRICE_WEI: ${RELAYER_MAX_GAS_PRICE_WEI:-150000000000}
      MONAD_TESTNET_RPC: ${MONAD_TESTNET_RPC:-https://testnet-rpc.monad.xyz}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:4174,http://localhost:4174}
    volumes:
      - river-data:/app/storage
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  river-data:
